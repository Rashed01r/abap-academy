<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABAP Academy 2.0 – Two-path home (simulation)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--tint:94,234,177;--bg:#07120e;--panel:#0e1f19;--tx:#dcf1e8;--mu:#94b5a8;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid rgb(var(--tint));outline-offset:2px}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(var(--tint),.17) 1px,transparent 1.3px);background-size:26px 26px;animation:gridmove 40s linear infinite;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 85%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 85%)}
body.nogrid .grid{animation:none}
@keyframes gridmove{to{background-position:26px 52px}}
.aur{position:fixed;inset:-10%;z-index:0;pointer-events:none}
.aur i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(var(--tint),.2),transparent 66%);animation:drift 26s ease-in-out infinite alternate}
.aur i:nth-child(1){width:55vw;height:55vw;left:2%;top:0}
.aur i:nth-child(2){width:46vw;height:46vw;right:0;top:28%;animation-duration:34s;animation-delay:-9s}
.aur i:nth-child(3){width:42vw;height:42vw;left:30%;bottom:-12%;animation-duration:42s;animation-delay:-17s;background:radial-gradient(circle,rgba(70,150,255,.12),transparent 66%)}
body.noaur .aur{display:none}
@keyframes drift{to{transform:translate(9vw,-7vh) scale(1.18)}}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:20px;padding:10px 20px;border-bottom:1px solid rgba(var(--tint),.16);background:rgba(7,18,14,.72);backdrop-filter:blur(10px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.logo{width:44px;height:44px;border-radius:12px;border:1px solid rgba(var(--tint),.4);display:grid;place-items:center;background:rgba(var(--tint),.1)}
.brand b{font-size:23px;font-weight:600;letter-spacing:-.4px}
.brand b span{font-weight:400}
.ver{position:absolute;right:-26px;top:-12px;font-size:11px;background:#14302a;border:1px solid rgba(var(--tint),.25);padding:1px 7px;border-radius:6px;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-left:30px}
.tab{background:none;border:0;padding:12px 10px;display:flex;gap:8px;align-items:center;color:var(--mu);border-bottom:2px solid transparent}
.tab.on{color:rgb(var(--tint));border-color:rgb(var(--tint))}
.searchwrap{position:relative;flex:1;min-width:220px;max-width:800px}
#q{width:100%;height:46px;border-radius:12px;border:1px solid rgba(var(--tint),.22);background:rgba(14,31,25,.8);color:var(--tx);padding:0 16px;font:inherit;font-size:15px}
#q::placeholder{color:#7fa093}
#sr{position:absolute;left:0;right:0;top:52px;background:#0d1d17;border:1px solid rgba(var(--tint),.3);border-radius:12px;padding:6px;display:none;z-index:30;box-shadow:0 20px 40px rgba(0,0,0,.5)}
#sr.open{display:block}
#sr button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px}
#sr button:hover,#sr button:focus-visible{background:rgba(var(--tint),.12)}
#sr .c{font-family:var(--mono);font-size:12px;color:rgb(var(--tint));min-width:70px}
#sr small{color:var(--mu);margin-left:auto}
.right{display:flex;gap:12px;align-items:center;margin-left:auto}
.xp{padding:7px 14px;border-radius:999px;background:rgba(var(--tint),.12);color:rgb(var(--tint));font-size:14px;transition:transform .3s}
.xp.pop{transform:scale(1.18)}
.pill{height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:12px;border:1px solid rgba(var(--tint),.22);background:rgba(14,31,25,.8)}
.sq{width:44px;height:44px;border-radius:12px;border:1px solid rgba(var(--tint),.22);background:rgba(14,31,25,.8);display:grid;place-items:center}
.crumb{display:flex;justify-content:space-between;gap:16px;padding:12px 20px;font-size:14px;background:rgba(7,18,14,.5);border-bottom:1px solid rgba(var(--tint),.1)}
.crumb nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:rgb(var(--tint))}
.crumb nav button{background:none;border:0;padding:0;color:inherit;text-decoration:none}
.crumb nav button:hover{text-decoration:underline}
.crumb nav i{font-style:normal;opacity:.6}
.crumb .hint{color:var(--mu)}
#stage{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.base{fill:none;stroke:rgba(var(--c),.34);stroke-width:1.6}
.flow{fill:none;stroke:rgb(var(--c));stroke-width:2.4;stroke-linecap:round;stroke-dasharray:3 22;animation:dash 1.1s linear infinite;filter:drop-shadow(0 0 4px rgba(var(--c),.9))}
body.noflow .flow{display:none}
@keyframes dash{to{stroke-dashoffset:-25}}
.n{position:absolute;left:0;top:0;will-change:transform,opacity}
.card{position:relative;width:100%;height:100%;text-align:left;border-radius:14px;border:1px solid rgba(var(--c),.28);background:rgba(13,30,24,.86);backdrop-filter:blur(6px);padding:12px 14px;display:flex;flex-direction:column;gap:4px;overflow:hidden;transition:border-color .2s,box-shadow .2s,background .2s,transform .2s}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),rgba(var(--c),.16),transparent 70%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover{border-color:rgba(var(--c),.7);transform:translateY(-2px)}
.card:hover::before{opacity:1}
.card.act{border-color:rgb(var(--c));background:rgba(var(--c),.13);box-shadow:0 0 0 1px rgba(var(--c),.3),0 0 28px rgba(var(--c),.22)}
.n.flash .card{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 3px rgba(var(--c),.9),0 0 40px rgba(var(--c),.6)}}
.t{font-size:15px;line-height:1.25;font-weight:500}
.s{font-size:12px;line-height:1.35;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{align-self:flex-start;margin-top:auto;font-size:12px;padding:2px 10px;border-radius:7px;background:rgba(var(--c),.14);color:rgb(var(--c))}
.chev{position:absolute;right:12px;top:12px;width:18px;height:18px;border-radius:50%;border:1px solid rgba(var(--c),.45);display:grid;place-items:center;font-size:11px;color:rgb(var(--c));transition:transform .25s}
.card.act .chev{transform:rotate(90deg);background:rgba(var(--c),.2)}
.k-root{align-items:center;justify-content:center;border-radius:30px;border:1px solid rgba(var(--c),.6);background:radial-gradient(circle at 50% 30%,rgba(var(--c),.22),rgba(8,20,15,.95));overflow:visible;animation:breathe 3.6s ease-in-out infinite;gap:0}
.k-root::after{content:'';position:absolute;inset:-6px;border-radius:36px;padding:3px;background:conic-gradient(from var(--ang),transparent 0 60%,rgb(var(--c)) 85%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;animation:spin 5s linear infinite;pointer-events:none}
@keyframes spin{to{--ang:360deg}}
@keyframes breathe{50%{box-shadow:0 0 70px rgba(var(--c),.4)}0%,100%{box-shadow:0 0 28px rgba(var(--c),.18)}}
.rt{font-size:46px;font-weight:700;letter-spacing:-1px;color:rgb(var(--c));text-shadow:0 0 22px rgba(var(--c),.55)}
.rs{font-size:11px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.k-path .ico{width:30px;height:30px;border-radius:9px;background:rgba(var(--c),.15);display:grid;place-items:center;color:rgb(var(--c));margin-bottom:2px}
.k-path .t{font-size:18px;font-weight:600}
.k-path{border-color:rgba(var(--c),.55);border-radius:18px}
.k-path .chip{position:absolute;right:42px;top:12px;margin:0}
.code{font-family:var(--mono);font-weight:600;font-size:15px;color:rgb(var(--c))}
.k-tcode{gap:2px;padding-top:10px}
.k-tcode .t{font-size:13.5px}
.dots{position:absolute;right:12px;top:14px;display:flex;gap:3px}
.dots b{width:6px;height:6px;border-radius:50%;border:1px solid rgb(var(--c))}
.dots b.on{background:rgb(var(--c))}
.done::after{content:'✓';position:absolute;right:10px;bottom:8px;width:20px;height:20px;border-radius:50%;background:rgb(var(--c));color:#04120c;font-size:12px;font-weight:700;display:grid;place-items:center}
.k-lesson .t{font-size:14px}
.tools{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:4px;padding:6px;border-radius:14px;border:1px solid rgba(var(--tint),.25);background:rgba(8,20,15,.9);backdrop-filter:blur(8px);z-index:5}
.tools button{background:none;border:0;padding:9px 12px;border-radius:9px;font-size:14px}
.tools button:hover{background:rgba(var(--tint),.12)}
.tools span{min-width:46px;text-align:center;color:var(--mu);font-size:14px}
.fxbtn{position:absolute;right:16px;bottom:16px;z-index:6;display:flex;align-items:center;gap:8px;border-radius:14px;border:1px solid rgba(var(--tint),.35);background:rgba(8,20,15,.92);padding:11px 16px;font-size:14px}
.fxbtn:hover{background:rgba(var(--tint),.14)}
#fx{position:absolute;right:16px;bottom:72px;z-index:6;width:290px;border-radius:16px;border:1px solid rgba(var(--tint),.3);background:rgba(8,20,15,.95);backdrop-filter:blur(10px);padding:16px;display:none;flex-direction:column;gap:12px}
#fx.open{display:flex}
#fx h3{margin:0;font-size:15px}
#fx p{margin:0;font-size:12px;color:var(--mu)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg label{display:block}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:8px;border-radius:9px;border:1px solid rgba(var(--tint),.25);font-size:13px;cursor:pointer}
.seg input:checked+span{background:rgba(var(--tint),.2);border-color:rgb(var(--tint));color:rgb(var(--tint))}
.seg input:focus-visible+span{outline:2px solid rgb(var(--tint))}
.chk{display:flex;gap:10px;align-items:center;font-size:13.5px}
.chk input{accent-color:rgb(var(--tint));width:18px;height:18px}
#fx input[type=range]{width:100%;accent-color:rgb(var(--tint))}
#drawer{position:absolute;right:16px;top:16px;bottom:84px;width:390px;max-width:calc(100% - 32px);z-index:8;border-radius:20px;border:1px solid rgba(var(--c,var(--tint)),.45);background:rgba(10,24,19,.95);backdrop-filter:blur(12px);padding:22px;overflow:auto;transform:translateX(115%);transition:transform .45s cubic-bezier(.2,.9,.2,1);box-shadow:0 30px 60px rgba(0,0,0,.5)}
#drawer.open{transform:none}
#drawer .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:10px;border:1px solid rgba(var(--tint),.25);background:none}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:7px;background:rgba(var(--c),.15);color:rgb(var(--c));margin-bottom:12px}
#drawer h2{margin:0 0 6px;font-size:22px;line-height:1.2;padding-right:40px}
#drawer .big{font-family:var(--mono);font-size:44px;font-weight:600;color:rgb(var(--c));text-shadow:0 0 24px rgba(var(--c),.5);margin:0 0 4px;line-height:1}
#drawer h4{margin:18px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
#drawer p{margin:0;line-height:1.55;font-size:14.5px}
.tip{border-left:0;padding:12px 14px;border-radius:12px;background:rgba(var(--c),.1);font-size:14px;line-height:1.5}
.sap{margin-top:18px;border-radius:12px;border:1px solid rgba(var(--c),.3);background:#071410;overflow:hidden}
.sapbar{display:flex;gap:8px;padding:8px;border-bottom:1px solid rgba(var(--c),.2);align-items:center}
.cmd{flex:1;font-family:var(--mono);font-size:14px;padding:8px 10px;border-radius:7px;background:#0d221b;min-height:36px;display:flex;align-items:center}
.cmd i{width:8px;height:16px;background:rgb(var(--c));margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.run{border:0;border-radius:8px;padding:8px 12px;background:rgb(var(--c));color:#04120c;font-weight:600;font-size:13px}
.win{padding:12px;display:none}
.win.on{display:block;animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.wt{font-size:13px;font-weight:600;margin-bottom:10px}
.sk{height:10px;border-radius:5px;margin:8px 0;background:linear-gradient(90deg,rgba(var(--c),.1),rgba(var(--c),.3),rgba(var(--c),.1));background-size:200% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.st{font-size:12px;color:rgb(var(--c));font-family:var(--mono);margin-top:10px}
.primary{margin-top:18px;width:100%;padding:13px;border-radius:12px;border:0;background:rgb(var(--c));color:#04120c;font-weight:600;font-size:15px}
.primary.off{background:transparent;border:1px solid rgb(var(--c));color:rgb(var(--c))}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);opacity:0;z-index:50;background:#14342a;border:1px solid rgba(var(--tint),.5);padding:11px 18px;border-radius:12px;font-size:14px;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.tabs{margin-left:0}.right .pill,.right .sq{display:none}#drawer{left:12px;right:12px;width:auto;top:auto;bottom:84px;max-height:60%}.ver{right:-24px}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="grid" aria-hidden="true"></div>
<div class="aur" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app">
<header>
  <div class="brand">
    <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgb(94,234,177)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/></svg></div>
    <b>ABAP <span>academy</span></b><span class="ver">2.0</span>
  </div>
  <div class="tabs">
    <button class="tab on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Learning roadmap</button>
    <button class="tab" id="simTab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>Simulator</button>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" autocomplete="off" placeholder="Search topics, T-codes or ABAP keywords  (try SE38, dump, SELECT)" aria-label="Search">
    <div id="sr" role="listbox"></div>
  </div>
  <div class="right">
    <span class="xp" id="xp">475 XP</span>
    <div class="pill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>System</div>
    <div class="sq" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></div>
  </div>
</header>
<div class="crumb"><nav id="crumb" aria-label="Breadcrumb"></nav><span class="hint">Two paths · explore freely</span></div>

<div id="stage">
  <div id="world"><svg id="wires"><g id="wg"></g></svg><div id="nodes"></div></div>

  <div class="tools" role="toolbar" aria-label="View controls">
    <button id="bBack">Back to ABAP</button>
    <button id="zOut" aria-label="Zoom out">−</button><span id="zv">100%</span><button id="zIn" aria-label="Zoom in">+</button>
    <button id="bFit">Fit tree</button><button id="bReset">Reset view</button>
  </div>

  <aside id="drawer" aria-live="polite"></aside>

  <div id="fx" role="dialog" aria-label="Effects lab">
    <h3>Effects lab</h3>
    <p>Try the moving background live. Pick what feels right.</p>
    <div class="seg" id="modeSeg">
      <label><input type="radio" name="mode" value="network" checked><span>Network</span></label>
      <label><input type="radio" name="mode" value="code"><span>Code rain</span></label>
      <label><input type="radio" name="mode" value="both"><span>Both</span></label>
      <label><input type="radio" name="mode" value="none"><span>None</span></label>
    </div>
    <label class="chk"><input type="checkbox" id="fAur" checked> Aurora glow</label>
    <label class="chk"><input type="checkbox" id="fGrid" checked> Dot grid drift</label>
    <label class="chk"><input type="checkbox" id="fFlow" checked> Flowing connectors</label>
    <label class="chk" style="flex-direction:column;align-items:stretch;gap:4px">Intensity<input type="range" id="fInt" min="20" max="100" value="70"></label>
  </div>
  <button class="fxbtn" id="fxBtn" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></svg>Effects</button>
</div>
</div>
<div id="toast" role="status"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MINT='94,234,177',AMBER='245,185,74';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- DATA ---------- */
const LEARN=[
 {id:'fund',t:'ABAP Fundamentals',s:'Learn to write ABAP with variables, conditions, loops and employee records.',lv:'Beginner',L:[
  ['Hello ABAP: your first report','Write, activate and run a program that prints to the screen.'],
  ['Variables and data types','Declare data with DATA and pick the right type for each value.'],
  ['Decisions with IF and CASE','Branch your logic based on conditions.'],
  ['Loops: DO and WHILE','Repeat work without copy-pasting code.'],
  ['Employee records with structures','Group related fields into one record.']]},
 {id:'data',t:'Working with Data',s:'Find, update and organize records in internal tables to build useful reports.',lv:'Beginner',L:[
  ['Internal tables: your in-memory list','Store many rows inside a running program.'],
  ['Reading rows with READ TABLE','Find one record by key or index.'],
  ['LOOP AT and field symbols','Walk through every row and change it in place.'],
  ['SORT and remove duplicates','Order rows and clean repeated entries.'],
  ['Totals and control breaks','Sum values and group a report by department.']]},
 {id:'dict',t:'ABAP Dictionary',s:'Understand how domains, data elements and fields form a reusable data model.',lv:'Beginner',L:[
  ['Introduction to ABAP Dictionary','Trace a reusable definition from technical type to stored field.'],
  ["Domains: define a value's shape once",'Set type, length and allowed values that many fields can reuse.'],
  ['Data elements: give a field its meaning','Add business meaning and screen labels on top of a technical type.'],
  ['Structures: group fields into one type','Define a reusable record type with define structure.'],
  ['Database tables: store rows for good','Define the employee table with its key fields.'],
  ['Foreign keys: link a field to a check table','Allow only departments that exist, and know where that check happens.'],
  ['Search helps: offer a list of valid values','Let users pick a department from an F4 list instead of typing it.']]},
 {id:'db',t:'Database Development',s:'Learn how ABAP SQL selects, filters and combines stored business data.',lv:'Intermediate',L:[
  ['SELECT: read from the database','Fetch rows into an internal table.'],
  ['Filter and sort with WHERE','Ask the database only for what you need.'],
  ['JOINs: combine tables','Bring employee and department data together.'],
  ['Aggregates and GROUP BY','Count, sum and average inside the database.'],
  ['INSERT, UPDATE and DELETE','Change stored data safely.']]},
 {id:'oo',t:'Object-Oriented ABAP',s:'Model business behavior with classes, independent objects and methods.',lv:'Intermediate',L:[
  ['Classes and objects','Model a business thing with attributes and behavior.'],
  ['Methods and parameters','Pass data in and get results out.'],
  ['Inheritance and redefinition','Reuse behavior and specialize it.'],
  ['Interfaces: one contract, many classes','Write code that works with any class that fits.'],
  ['Exceptions with TRY and CATCH','Handle errors without crashing.']]},
 {id:'app',t:'SAP Application Development',s:'Build and extend modern SAP apps with CDS, RAP and OData.',lv:'Advanced',L:[
  ['CDS views: model data once','Define reusable, annotated data models.'],
  ['RAP: build a managed app','Create, read, update and delete with behavior definitions.'],
  ['OData services for the front end','Expose your data to Fiori and web apps.'],
  ['Enhancements and BAdIs','Extend standard SAP without modifying it.'],
  ['ABAP Cloud: clean-core rules','Write upgrade-safe code with released APIs.']]}
];

/* ---------- TREE ---------- */
const mk=(id,label,depth,o)=>Object.assign({id,label,depth,children:[],x:0,y:0,a:0,tx:0,ty:0,ta:0},o);
const root=mk('abap','ABAP',0,{kind:'root',color:MINT});
const learn=mk('learn','Learning',1,{kind:'path',color:MINT,sub:'Step-by-step lessons from your first report to RAP.',chip:'40 lessons',ico:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/>'});
const tcn=mk('tcodes','Transaction Codes',1,{kind:'path',color:AMBER,sub:'The T-codes every SAP developer needs, with tips.',ico:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>'});

 c.L.forEach((l,i)=>cn.children.push(mk(c.id+i,l[0],3,{kind:'lesson',color:MINT,sub:l[1],lv:c.lv,cat:c.t})));learn.children.push(cn)});

TC.forEach(c=>{const cn=mk(c.id,c.t,2,{kind:'cat',color:AMBER,sub:c.s,chip:c.I.length+' T-codes'});
 c.I.forEach(i=>{tcCount++;cn.children.push(mk('t_'+i[0],i[1],3,{kind:'tcode',color:AMBER,code:i[0],sub:i[2],tip:i[3],f:i[4],cat:c.t}))});tcn.children.push(cn)});
tcn.chip=tcCount+' T-codes';
const all=[];(function w(n,p){n.parent=p;all.push(n);n.children.forEach(c=>w(c,n))})(root,null);

const WD=[170,230,250,280],HT=[130,116,106,90],XS=[0,250,530,840],GAP=14;
const expanded=new Set(),done=new Set();
let selected=null,xp=475,drawerOpen=false;
const nodesEl=$('#nodes'),wg=$('#wg'),stage=$('#stage'),world=$('#world');
const live=new Map();

function collapse(n){expanded.delete(n.id);n.children.forEach(collapse)}
function expand(n){if(n.parent)n.parent.children.forEach(s=>{if(s!==n)collapse(s)});expanded.add(n.id)}

function layout(){
  let y=0;const vis=new Set();
  (function place(n){
    n.tw=WD[n.depth];n.th=HT[n.depth];n.tx=XS[n.depth];vis.add(n);
    const kids=(n===root||expanded.has(n.id))?n.children:[];
    if(!kids.length){n.ty=y+n.th/2;y+=n.th+GAP;return}
    kids.forEach(place);n.ty=(kids[0].ty+kids[kids.length-1].ty)/2;
  })(root);
  vis.forEach(n=>{
    if(!live.has(n.id)){ // new node: start at parent
      const p=n.parent||n;n.x=p.x;n.y=p.y;n.a=0;mkEl(n);live.set(n.id,n);
    }
    n.ta=1;
  });
  live.forEach(n=>{if(!vis.has(n)){n.ta=0;const p=n.parent;if(p){n.tx=p.tx;n.ty=p.ty}}});
  refresh();
}
function mkEl(n){
  const el=document.createElement('div');el.className='n';el.style.width=WD[n.depth]+'px';el.style.height=HT[n.depth]+'px';
  const b=document.createElement('button');b.className='card k-'+n.kind;b.style.setProperty('--c',n.color);
  let h='';
  if(n.kind==='root')h='<span class="rt">ABAP</span><span class="rs">SAP developer hub</span>';
  else if(n.kind==='path')h=`<span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${n.ico}</svg></span><span class="t">${esc(n.label)}</span><span class="s">${esc(n.sub)}</span><span class="chip">${esc(n.chip)}</span><span class="chev">›</span>`;
  else if(n.kind==='cat')h=`<span class="t">${esc(n.label)}</span><span class="s">${esc(n.sub)}</span><span class="chip">${esc(n.chip)}</span><span class="chev">›</span>`;
  else if(n.kind==='lesson')h=`<span class="t">${esc(n.label)}</span><span class="s">${esc(n.sub)}</span>`;
  else h=`<span class="code">${esc(n.code)}</span><span class="t">${esc(n.label)}</span><span class="s">${esc(n.sub)}</span><span class="dots" role="img" aria-label="${FREQ[n.f]}">${[1,2,3].map(i=>`<b class="${i<=n.f?'on':''}"></b>`).join('')}</span>`;
  b.innerHTML=h;
  b.addEventListener('click',()=>onClick(n));
  b.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-r.left)/cam.k+'px');b.style.setProperty('--my',(e.clientY-r.top)/cam.k+'px')});
  el.appendChild(b);nodesEl.appendChild(el);n.el=el;n.btn=b;
  if(n.parent){
    const ns='http://www.w3.org/2000/svg',g=document.createElementNS(ns,'g');g.style.setProperty('--c',n.color);
    g.innerHTML='<path class="base"/><path class="flow"/>';g.setAttribute('style',`--c:${n.color}`);
    wg.appendChild(g);n.wire=g;n.p1=g.children[0];n.p2=g.children[1];
  }
}
function refresh(){
  live.forEach(n=>{
    n.btn.classList.toggle('act',expanded.has(n.id)||selected===n.id);
    n.btn.classList.toggle('done',done.has(n.id));
  });
  crumb();tint();
}
function onClick(n){
  if(n.kind==='root'){closeDrawer();expanded.clear();selected=null;layout();fit();return}
  if(n.children.length){
    if(expanded.has(n.id))collapse(n);else expand(n);
    selected=null;closeDrawer();layout();fit();return;
  }
  selected=n.id;openDrawer(n);refresh();
}

/* ---------- CAMERA ---------- */
const cam={x:0,y:0,k:1},camT={x:0,y:0,k:1};let camInit=false;
function fit(){
  const r=stage.getBoundingClientRect();const aw=r.width-(drawerOpen&&r.width>820?410:0);
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  let f=null;expanded.forEach(id=>{const n=all.find(x=>x.id===id);if(!f||n.depth>f.depth)f=n});
  const foc=new Set(root.children);foc.add(root);if(f){for(let p=f;p;p=p.parent)foc.add(p);f.children.forEach(c=>foc.add(c))}
  live.forEach(n=>{if(n.ta===0||(f&&!foc.has(n)))return;a=Math.min(a,n.tx);b=Math.max(b,n.tx+n.tw);c=Math.min(c,n.ty-n.th/2);d=Math.max(d,n.ty+n.th/2)});
  const bw=b-a,bh=d-c,pad=56;
  let k=Math.min((aw-pad*2)/bw,(r.height-pad*2-50)/bh,1.05);k=Math.max(.3,k);
  camT.k=k;camT.x=(aw-bw*k)/2-a*k;camT.y=(r.height-bh*k)/2-c*k-14;
  if(!camInit){Object.assign(cam,camT);camInit=true}
}
let drag=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.card,.tools,#drawer,#fx,.fxbtn'))return;drag={x:e.clientX,y:e.clientY};stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};cam.x+=dx;cam.y+=dy;camT.x+=dx;camT.y+=dy});
const endDrag=()=>{drag=null;stage.classList.remove('drag')};
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
function zoomAt(f,px,py){const k=Math.min(1.6,Math.max(.3,camT.k*f));const r=k/camT.k;camT.x=px-(px-camT.x)*r;camT.y=py-(py-camT.y)*r;camT.k=k}
stage.addEventListener('wheel',e=>{if(e.target.closest('#drawer,#fx'))return;e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0012),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('#zIn').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1.15,r.width/2,r.height/2)};
$('#zOut').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1/1.15,r.width/2,r.height/2)};
$('#bFit').onclick=fit;$('#bReset').onclick=()=>{expanded.clear();selected=null;closeDrawer();layout();fit()};
$('#bBack').onclick=$('#bReset').onclick;
addEventListener('resize',()=>{fit();bgResize()});

/* ---------- DRAWER ---------- */
const dr=$('#drawer');let typer=null;
function openDrawer(n){
  drawerOpen=true;dr.style.setProperty('--c',n.color);
  const isT=n.kind==='tcode',dn=done.has(n.id),xpv=isT?10:25;
  let h=`<button class="x" aria-label="Close">✕</button>`;
  if(isT){
    h+=`<span class="tag">Transaction code · ${esc(n.cat)}</span><p class="big">${esc(n.code)}</p><h2>${esc(n.label)}</h2>
    <h4>What it does</h4><p>${esc(n.sub)}</p><h4>Developer tip</h4><div class="tip">${esc(n.tip)}</div><h4>${FREQ[n.f]}</h4>
    <div class="sap"><div class="sapbar"><div class="cmd"><span id="cmdT"></span><i></i></div><button class="run" id="runB">Run ▶</button></div>
    <div class="win" id="win"><div class="wt">${esc(n.label)}</div><div class="sk" style="width:90%"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:80%"></div><div class="st">✓ Transaction ${esc(n.code)} started</div></div></div>`;
  }else{
    h+=`<span class="tag">Lesson · ${esc(n.lv)}</span><h2>${esc(n.label)}</h2><h4>You will learn</h4><p>${esc(n.sub)}</p><h4>Part of</h4><p>${esc(n.cat)}</p>`;
  }
  h+=`<button class="primary ${dn?'off':''}" id="doneB">${dn?'Completed ✓':(isT?'Mark as learned':'Start and complete lesson')} ${dn?'':'· +'+xpv+' XP'}</button>`;
  dr.innerHTML=h;dr.classList.add('open');
  dr.querySelector('.x').onclick=()=>{closeDrawer();selected=null;refresh();fit()};
  $('#doneB').onclick=()=>{if(done.has(n.id))return;done.add(n.id);gain(xpv);openDrawer(n);refresh()};
  if(isT)$('#runB').onclick=()=>runSim(n);
  fit();
}
function runSim(n){
  clearInterval(typer);const t=$('#cmdT'),w=$('#win');w.classList.remove('on');t.textContent='';
  const s='/n'+n.code;let i=0;typer=setInterval(()=>{t.textContent=s.slice(0,++i);if(i>=s.length){clearInterval(typer);setTimeout(()=>w.classList.add('on'),250)}},90);
}
function closeDrawer(){clearInterval(typer);drawerOpen=false;dr.classList.remove('open')}
function gain(v){xp+=v;const e=$('#xp');e.textContent=xp+' XP';e.classList.add('pop');setTimeout(()=>e.classList.remove('pop'),300);toast('+'+v+' XP')}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
$('#simTab').onclick=()=>toast('Simulator tab stays as it is in this mockup');
addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();selected=null;refresh();$('#sr').classList.remove('open');$('#fx').classList.remove('open')}});

/* ---------- BREADCRUMB ---------- */
function crumb(){
  let t=null;if(selected)t=all.find(n=>n.id===selected);
  else{all.forEach(n=>{if(expanded.has(n.id)&&(!t||n.depth>t.depth))t=n})}
  const ch=[];for(let n=t||root;n;n=n.parent)ch.unshift(n);
  const nav=$('#crumb');nav.innerHTML='';
  ch.forEach((n,i)=>{if(i)nav.insertAdjacentHTML('beforeend','<i>→</i>');const b=document.createElement('button');b.textContent=n.kind==='tcode'?n.code:n.label;b.onclick=()=>reveal(n);nav.appendChild(b)});
}

/* ---------- SEARCH ---------- */
const q=$('#q'),sr=$('#sr');
function results(v){v=v.trim().toLowerCase();if(!v)return[];
  const m=all.filter(n=>n.depth>=1&&((n.label+' '+(n.code||'')+' '+(n.sub||'')).toLowerCase().includes(v)));
  m.sort((a,b)=>((b.code||'').toLowerCase()===v)-((a.code||'').toLowerCase()===v)||(b.label.toLowerCase().startsWith(v))-(a.label.toLowerCase().startsWith(v)));
  return m.slice(0,7)}
q.addEventListener('input',()=>{const r=results(q.value);sr.innerHTML=r.map((n,i)=>`<button data-i="${i}"><span class="c">${esc(n.code||(n.kind==='lesson'?'Lesson':n.kind==='cat'?'Topic':'Path'))}</span>${esc(n.label)}<small>${esc(n.depth>=2?(n.parent.label):'')}</small></button>`).join('');
  sr.classList.toggle('open',r.length>0);sr.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{reveal(r[i]);sr.classList.remove('open')})});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=results(q.value);if(r[0]){reveal(r[0]);sr.classList.remove('open')}}});
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))sr.classList.remove('open')});
function reveal(n){
  const chain=[];for(let p=n;p;p=p.parent)chain.unshift(p);
  expanded.clear();chain.forEach(c=>{if(c.children.length&&c!==n)expand(c)});
  if(n.children.length)expand(n);
  selected=null;closeDrawer();
  layout();
  if(!n.children.length){selected=n.id;openDrawer(n)}
  fit();refresh();
  const e=live.get(n.id);if(e&&e.el){e.el.classList.add('flash');setTimeout(()=>e.el.classList.remove('flash'),2600)}
}

/* ---------- BACKGROUND ---------- */
const fx={mode:reduce?'none':'network',aur:!reduce,grid:!reduce,flow:!reduce,int:.7};
const bg=$('#bg'),ctx=bg.getContext('2d');let BW,BH,DPR,pts=[],toks=[];
const mouse={x:-999,y:-999};
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
const WORDS=['SELECT','FROM','WHERE','LOOP AT','ENDLOOP.','DATA:','TYPES:','CLASS','METHOD','ENDMETHOD.','READ TABLE','APPEND','IF','ENDIF.','sy-subrc','INTO TABLE','@DATA(','CDS','RAP','TRY.','CATCH','FIELD-SYMBOLS','SE38','SE11','SE80','ST22','SM37','/nSE16','MODIFY','COMMIT WORK.','CALL FUNCTION','ASSIGN','PERFORM'];
function bgResize(){DPR=Math.min(devicePixelRatio||1,2);BW=innerWidth;BH=innerHeight;bg.width=BW*DPR;bg.height=BH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  const n=Math.min(110,Math.floor(BW*BH/16000));pts=Array.from({length:n},()=>({x:Math.random()*BW,y:Math.random()*BH,vx:(Math.random()-.5)*26,vy:(Math.random()-.5)*26,r:Math.random()*1.4+.7}));
  const m=Math.min(60,Math.floor(BW/26));toks=Array.from({length:m},()=>newTok(true))}
function newTok(init){return{x:Math.random()*BW,y:init?Math.random()*BH:BH+20,v:8+Math.random()*22,s:11+Math.random()*4,a:.05+Math.random()*.12,t:WORDS[Math.random()*WORDS.length|0]}}
const tintC=[94,234,177];let tintT=[94,234,177];
function tint(){const t=expanded.has('tcodes')?AMBER:MINT;tintT=t.split(',').map(Number)}
function bgDraw(dt){
  ctx.clearRect(0,0,BW,BH);if(fx.mode==='none')return;
  const I=fx.int,col=`${tintC[0]|0},${tintC[1]|0},${tintC[2]|0}`;
  if(fx.mode==='network'||fx.mode==='both'){
    for(const p of pts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<0||p.x>BW)p.vx*=-1;if(p.y<0||p.y>BH)p.vy*=-1;
      const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);if(d<180&&d>1){p.x+=dx/d*18*dt;p.y+=dy/d*18*dt}}
    ctx.lineWidth=1;
    for(let i=0;i<pts.length;i++){const a=pts[i];
      for(let j=i+1;j<pts.length;j++){const b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<135){ctx.strokeStyle=`rgba(${col},${(1-d/135)*.28*I*1.4})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
      const dm=Math.hypot(a.x-mouse.x,a.y-mouse.y);if(dm<170){ctx.strokeStyle=`rgba(${col},${(1-dm/170)*.6*I})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke()}
      ctx.fillStyle=`rgba(${col},${.55*I+.1})`;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.3);ctx.fill()}
  }
  if(fx.mode==='code'||fx.mode==='both'){
    for(const k of toks){k.y-=k.v*dt;if(k.y<-20)Object.assign(k,newTok(false));
      ctx.font=`${k.s}px "JetBrains Mono",monospace`;ctx.fillStyle=`rgba(${col},${k.a*I*1.6})`;ctx.fillText(k.t,k.x,k.y)}
  }
}

/* ---------- LOOP ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const f=1-Math.exp(-dt*9),fc=1-Math.exp(-dt*6);
  live.forEach(n=>{
    n.x+=(n.tx-n.x)*f;n.y+=(n.ty-n.y)*f;n.a+=(n.ta-n.a)*f;
    const s=.88+.12*n.a;
    n.el.style.transform=`translate(${n.x}px,${n.y-n.th/2}px) scale(${s})`;
    n.el.style.opacity=n.a.toFixed(3);n.el.style.pointerEvents=n.ta?'auto':'none';
    if(n.wire){const p=n.parent,sx=p.x+p.tw*(.85+.15*n.a)-(p.tw*.15*(1-n.a)),sy=p.y,ex=n.x,ey=n.y,dx=(ex-sx)*.5;
      const d=`M${sx} ${sy}C${sx+dx} ${sy},${ex-dx} ${ey},${ex} ${ey}`;n.p1.setAttribute('d',d);n.p2.setAttribute('d',d);n.wire.style.opacity=n.a.toFixed(3)}
    if(n.ta===0&&n.a<.02){n.el.remove();if(n.wire)n.wire.remove();live.delete(n.id)}
  });
  cam.x+=(camT.x-cam.x)*fc;cam.y+=(camT.y-cam.y)*fc;cam.k+=(camT.k-cam.k)*fc;
  world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;$('#zv').textContent=Math.round(cam.k*100)+'%';
  for(let i=0;i<3;i++)tintC[i]+=(tintT[i]-tintC[i])*Math.min(1,dt*3);
  document.documentElement.style.setProperty('--tint',`${tintC[0]|0},${tintC[1]|0},${tintC[2]|0}`);
  bgDraw(dt);requestAnimationFrame(frame);
}
bgResize();layout();fit();requestAnimationFrame(frame);
})();
